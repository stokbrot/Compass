<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  </style>
</head>
<div id="settingsMenu" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); color:#fff; font-family:system-ui,sans-serif; align-items:center; justify-content:center; z-index:10;">
  <div style="background:#1a1b1f; padding:2rem; border-radius:10px; min-width:280px;">
    <h2 style="margin-top:0;">Settings</h2>
    <label style="display:block; margin-bottom:0.5rem;">Mouse sensitivity</label>
    <input type="range" id="sensSlider" min="200" max="3000" value="800" style="width:100%;">
    <p style="color:#999; font-size:0.85rem; margin-top:1.5rem;">Press P to resume</p>
  </div>
</div>
<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
